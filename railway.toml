[build]
builder = "dockerfile"

[deploy]
healthcheckPath = "/setup/healthz"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

# Require a persistent volume mounted at /data (Railway).
requiredMountPath = "/data"

[variables]
# NOTE: Railway injects PORT automatically.
# Do not set PORT here; Railway templates may not apply it reliably and hardcoding
# can cause domain routing mismatches.
OPENCLAW_STATE_DIR = "/data/.openclaw"
OPENCLAW_WORKSPACE_DIR = "/data/workspace"

# Give the wrapper time to stop the gateway cleanly on redeploy (SIGTERM -> SIGKILL buffer).
RAILWAY_DEPLOYMENT_DRAINING_SECONDS = "30"

# Set to the HTTPS origin users open in the browser (e.g. your Cloudflare hostname).
# Required for the Control UI websocket origin check when served behind a proxy.
# OPENCLAW_PUBLIC_ORIGIN = "https://openclaw.example.com"
